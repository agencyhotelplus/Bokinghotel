<!doctype html>
<html lang="id">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Booking - BookingHotelIndonesia</title><link rel="stylesheet" href="style.css"></head>
<body>
<header class="site-header"><a class="brand" href="index.html"><span class="brand-icon">🏨</span> BookingHotelIndonesia</a><nav class="nav"><a href="index.html">Beranda</a><a href="hotels.html">Hotel</a><a class="active" href="booking.html">Booking</a><a href="contact.html">Kontak</a></nav><a class="wa" href="https://wa.me/" target="_blank">WhatsApp</a><button class="menu-btn">☰</button></header>
<main class="page"><div class="page-title"><div class="eyebrow">PEMESANAN</div><h1>Konfirmasi booking</h1><p>Isi data berikut untuk melanjutkan pemesanan.</p></div>
<div class="booking-layout"><div id="bookingHotel" class="summary-card"></div>
<form id="bookingForm" class="form-card">
<label>Nama pemesan<input name="name" required placeholder="Nama lengkap"></label>
<label>Nomor WhatsApp<input name="phone" required type="tel" placeholder="08xxxxxxxxxx"></label>
<label>Check-in<input name="checkin" required type="date"></label>
<label>Check-out<input name="checkout" required type="date"></label>
<label>Jumlah tamu<input name="guests" required type="number" min="1" value="2"></label>
<button class="primary" type="submit">Konfirmasi Booking</button>
<div id="bookingMessage"></div>
</form></div></main>
<footer>© <span id="year"></span> BookingHotelIndonesia</footer><script src="script.js"></script>
</body></html>
