<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BookingHotel - Pemesanan</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="navbar">
  <a class="logo" href="index.html">Booking<span>Hotel</span></a>
  <nav>
    <a href="index.html">Beranda</a>
    <a href="hotels.html">Hotel</a>
    <a class="active" href="booking.html">Booking</a>
    <a href="contact.html">Kontak</a>
  </nav>
</header>

<main class="page">
  <section class="page-title">
    <p class="eyebrow">PEMESANAN</p>
    <h1>Form Booking Hotel</h1>
  </section>

  <div class="booking-layout">
    <div id="bookingHotel" class="summary-card"></div>

    <form id="bookingForm" class="form-card">
      <label>Nama lengkap
        <input name="name" required placeholder="Nama lengkap">
      </label>
      <label>Nomor WhatsApp
        <input name="phone" required type="tel" placeholder="08xxxxxxxxxx">
      </label>
      <label>Check-in
        <input name="checkin" required type="date">
      </label>
      <label>Check-out
        <input name="checkout" required type="date">
      </label>
      <label>Jumlah tamu
        <input name="guests" required type="number" min="1" value="1">
      </label>
      <button class="btn" type="submit">Kirim Pemesanan</button>
      <div id="bookingMessage"></div>
    </form>
  </div>
</main>

<footer>© <span id="year"></span> BookingHotel</footer>
<script src="script.js"></script>
</body>
</html>
